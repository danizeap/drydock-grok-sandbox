# Project LGF gate applicability for drydock-grok-sandbox.
# Throwaway LITE sandbox — NOT a production launch. Do not treat this as a clean ship.
# Copied from sdd-plus/security/gate-applicability.output.template.yml and filled from repo evidence.
project: "drydock-grok-sandbox"
change: "bootstrap-lgf-packet"
date: "2026-09-01"
owner: "Daniel Paez"
reviewer: ""

source_of_truth:
  - "sdd-plus/specs/launchguardian-framework.md"
  - "sdd-plus/standards/security-shipping-standards.md"
  - "sdd-plus/security/gate-applicability.template.yml"
  - "PROJECT_CONTEXT.md"

high_risk_skip_rule:
  rule: "For any high-risk gate, applies: false is invalid unless human_confirmation_required, confirmed_by, confirmed_at, reason, and evidence are filled."
  required_when_high_risk_gate_is_skipped:
    human_confirmation_required: true
    confirmed_by: "required"
    confirmed_at: "required"
    reason: "required"
    evidence: "required"

always_on_gates:
  - "Gate 0 — Scope & Permission"
  - "Gate 1 — Product, Asset & Data Inventory"
  - "Gate 3 — Code Security"
  - "Gate 4 — Secrets & Config Hygiene"
  - "Gate 10 — Dependency, SBOM & Supply Chain"
  - "Gate 17 — Observability, Logs & Incident Readiness"
  - "Gate 20 — Launch Decision"

gates:
  - gate_id: 0
    gate_name: "Gate 0 — Scope & Permission"
    applies: true
    confidence: "high"
    evidence:
      - type: "repo_evidence"
        detail: "Scope is this public throwaway repo only. PROJECT_CONTEXT.md and README.md state it is not a client project."
        reference: "PROJECT_CONTEXT.md"
      - type: "human_statement"
        detail: "Owner asked for Drydock-on-Grok v1 sandbox bootstrap on this repo; no client/LOQ trees."
        reference: ""
    reason: "Always-on. Scope is the sandbox repo plus GitHub Actions on ubuntu-latest."
    human_confirmation_required: true
    confirmed_by: ""
    confirmed_at: ""
    unresolved_questions:
      - "Owner has not signed Gate 0 as a production-launch approval. This file is sandbox inventory, not launch sign-off."

  - gate_id: 1
    gate_name: "Gate 1 — Product, Asset & Data Inventory"
    applies: true
    confidence: "high"
    evidence:
      - type: "repo_evidence"
        detail: "Python kernel/hooks/scripts/tests, GitHub Actions workflow, sdd-plus templates. No app frontend, API server, or datastore."
        reference: "sdd-plus/security/product-inventory.yml"
    reason: "Always-on. Inventory exists and describes a non-product sandbox."
    human_confirmation_required: false
    confirmed_by: ""
    confirmed_at: ""
    unresolved_questions: []

