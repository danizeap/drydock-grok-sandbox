name: drydock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  drydock:
    name: drydock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Start probe
        run: python3 scripts/start_probe.py

      - name: Pytest (no bytecode, no cache)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q -p no:cacheprovider

      - name: Install LaunchGuardian (fail closed — do not skip)
        run: |
          python3 -m pip install "launchguardian @ git+https://github.com/danizeap/launchguardian-cli@fix/scanner-evidence-fail-closed"
          command -v launchguardian
          launchguardian --version

      - name: LaunchGuardian scan --strict-scanners
        run: |
          mkdir -p reports/launchguardian
          launchguardian scan --target . --strict-scanners --output-dir reports/launchguardian
          test -f reports/launchguardian/launchguardian-report.json

      - name: Fail closed on quiet/blocked/incomplete scan
        run: python3 scripts/ci_parse_lg_report.py reports/launchguardian/launchguardian-report.json
