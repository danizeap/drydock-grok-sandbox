name: drydock

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  drydock:
    name: drydock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Start probe
        run: python3 scripts/start_probe.py

      - name: Pytest (no bytecode, no cache)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m pip install pytest
          python3 -m pytest -q -p no:cacheprovider

      - name: Install LaunchGuardian (fail closed — do not skip)
        run: |
          python3 -m pip install "launchguardian @ git+https://github.com/danizeap/launchguardian-cli@fix/scanner-evidence-fail-closed"
          command -v launchguardian
          launchguardian --version

      - name: Install gitleaks, semgrep, and trivy
        env:
          GITLEAKS_VERSION: "8.30.1"
          # SHA256 of gitleaks_8.30.1_linux_x64.tar.gz from official checksums.txt
          # https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
          SEMGREP_VERSION: "1.175.0"
          TRIVY_VERSION: "0.74.0"
          # SHA256 of trivy_0.74.0_Linux-64bit.tar.gz from official checksums.txt
          # https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_checksums.txt
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          set -euo pipefail

          # Gitleaks: official GitHub release binary (MIT). Checksum-pinned.
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          command -v gitleaks
          gitleaks version

          # Semgrep: documented pip install (https://pypi.org/project/semgrep/). Version-pinned.
          python3 -m pip install "semgrep==${SEMGREP_VERSION}"
          command -v semgrep
          semgrep --version

          # Trivy: official GitHub release binary. Checksum-pinned.
          curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            -o /tmp/trivy.tar.gz
          echo "${TRIVY_SHA256}  /tmp/trivy.tar.gz" | sha256sum -c -
          tar -xzf /tmp/trivy.tar.gz -C /tmp trivy
          sudo install -m 0755 /tmp/trivy /usr/local/bin/trivy
          command -v trivy
          trivy --version

      - name: LaunchGuardian scan --strict-scanners
        run: |
          mkdir -p reports/launchguardian
          set +e
          launchguardian scan --target . --strict-scanners --output-dir reports/launchguardian
          scan_exit=$?
          set -e
          echo "launchguardian_exit=${scan_exit}"
          if [ ! -f reports/launchguardian/launchguardian-report.json ]; then
            echo "missing report JSON after scan (exit ${scan_exit}) — quiet scan is a fail"
            exit 1
          fi

      - name: Fail closed on quiet/blocked/incomplete scan
        run: python3 scripts/ci_parse_lg_report.py reports/launchguardian/launchguardian-report.json
